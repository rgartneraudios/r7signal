name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, harness y auditoría
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: Lint (informativo hasta cerrar los 5 react-hooks)
        run: npm run lint
        continue-on-error: true

      - name: Compilación
        run: npm run build

      - name: Harness
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
