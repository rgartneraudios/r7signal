# Actualizaciones automáticas de dependencias (Dependabot version updates).
# Las alertas de seguridad se configuran aparte, en Settings > Code security.
# Este archivo solo tiene efecto en la rama por defecto (main).

version: 2

updates:
  # ---- Frontend / web (React + Vite) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencias"
    groups:
      produccion-parches:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      desarrollo-parches:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Los saltos mayores se hacen a mano, con rama propia y ventana fija.
    ignore:
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@tailwindcss/postcss"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "phaser"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "globals"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-plugin-react-hooks"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-plugin-react-refresh"
        update-types:
          - "version-update:semver-major"

  # ---- Escritorio (Tauri / Rust) ----
  # Los mayores de Tauri y gtk-rs se migran a mano: mueven ABI y dependen del SO.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-tauri)"
    labels:
      - "dependencias"
    groups:
      tauri-parches:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "tauri"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tauri-build"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "glib"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gtk"
        update-types:
          - "version-update:semver-major"
